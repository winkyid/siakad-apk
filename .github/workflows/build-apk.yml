name: Build APK from Web

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          # Buat project cordova
          cordova create siakad_app com.siakad.ump SIAKAD
          cd siakad_app

          # Tambah platform android
          cordova platform add android

          # Download Icon
          mkdir -p res
          curl -s -L "https://siakad.umpalangkaraya.ac.id/krs/images/Graphic-3.png" -o res/icon.png

          # Edit config.xml untuk redirect URL dan Splash Screen
          cat <<EOF > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.siakad.ump" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>SIAKAD UMP</name>
              <description>Aplikasi SIAKAD UM Palangkaraya</description>
              <author email="dev@example.com">Developer</author>
              <content src="https://siakad.umpalangkaraya.ac.id/krs/login.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-navigation href="https://siakad.umpalangkaraya.ac.id/*" />
              <preference name="Orientation" value="default" />
              <preference name="SplashScreenDelay" value="3000" />
              <preference name="AutoHideSplashScreen" value="true" />
              <icon src="res/icon.png" />
          </widget>
          EOF

      - name: Build Android APK
        run: |
          cd siakad_app
          cordova build android --debug

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp siakad_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk output/siakad-ump.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SIAKAD UMP Release v1.0.${{ github.run_number }}
          body: |
            APK SIAKAD UM Palangkaraya berhasil di-build.
            URL: https://siakad.umpalangkaraya.ac.id/krs/login.html
          files: output/siakad-ump.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
