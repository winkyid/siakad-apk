name: Build APK from Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Template Project
        uses: actions/checkout@v4
        with:
          repository: 'ShoukoCoder/WebToApp-Template'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure App Details & Assets
        run: |
          # Unduh Ikon Aplikasi
          curl -s -L "https://siakad.umpalangkaraya.ac.id/krs/images/Graphic-3.png" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
          # Konfigurasi URL Website di File Strings / Configuration
          sed -i 's|https://example.com|https://siakad.umpalangkaraya.ac.id/krs/login.html|g' app/src/main/res/values/strings.xml || true

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SIAKAD UMP Release v1.0.${{ github.run_number }}
          body: |
            APK SIAKAD UM Palangkaraya berhasil di-build.
            URL Target: https://siakad.umpalangkaraya.ac.id/krs/login.html
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
